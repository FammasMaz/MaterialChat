name: Android Attachment Regression

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Exact commit to verify (defaults to this workflow revision)'
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: 'Exact release commit to verify'
        required: true
        type: string

permissions:
  contents: read

jobs:
  attachment-regression:
    name: Native attachments (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Enable hosted KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build instrumentation APKs and run JVM regressions
        run: |
          chmod +x gradlew
          ./gradlew :app:testGithubDebugUnitTest :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest \
            --no-daemon --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8'

      - name: Run real Android image, sharing and Room tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 2048M
          disk-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew :app:connectedGithubDebugAndroidTest --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx2g -Pandroid.testInstrumentationRunnerArguments.class=com.materialchat.util.AttachmentImporterTest,com.materialchat.util.GeneratedImageActionsTest,com.materialchat.data.repository.ConversationAttachmentCleanupTest,com.materialchat.ui.screens.chat.ChatViewModelAttachmentCleanupTest,com.materialchat.assistant.service.MaterialChatVoiceInteractionSessionTest

      - name: Record tested commit
        if: always()
        run: |
          mkdir -p test-evidence
          git rev-parse HEAD > test-evidence/tested-commit.txt
          printf 'Android API %s\n' '${{ matrix.api }}' > test-evidence/device.txt

      - name: Upload reproducible test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attachment-regression-api-${{ matrix.api }}
          retention-days: 7
          path: |
            test-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/tests/testGithubDebugUnitTest/
            app/build/test-results/testGithubDebugUnitTest/
